<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="運転士支援">
<title>運転士支援タブレット</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
  body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; }
  #canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000; }
  .g { position: absolute; box-sizing: border-box; }
  .tx { position: absolute; inset: 0; display: flex; overflow: visible; line-height: 1; }
  .tx span { display: block; max-width: 100%; }

  /* 接続番号の画面 */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #10141c; z-index: 10; }
  #login .box { width: min(420px, 90vw); padding: 28px; border-radius: 16px; background: #1b2230; box-shadow: 0 10px 40px #0008; text-align: center; }
  #login h1 { font-size: 20px; margin: 0 0 6px; }
  #login p { color: #9aa6ba; font-size: 14px; margin: 0 0 18px; line-height: 1.6; }
  #code { width: 100%; box-sizing: border-box; font-size: 34px; letter-spacing: 10px; text-align: center; padding: 12px; border-radius: 10px; border: 1px solid #3a4560; background: #0d1119; color: #fff; }
  #go { margin-top: 16px; width: 100%; padding: 14px; font-size: 18px; font-weight: 700; border: 0; border-radius: 10px; background: #0a6ed1; color: #fff; }
  #err { color: #ff8a80; font-size: 14px; min-height: 20px; margin-top: 10px; }

  /* 状態の表示（右上） */
  #status { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; z-index: 5; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: #000a; color: #ccc; display: none; }
  #status.bad { background: #b71c1cdd; color: #fff; }
  #change { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); right: 10px; z-index: 5; font-size: 12px; padding: 6px 12px; border-radius: 99px; border: 0; background: #0008; color: #aaa; display: none; }

  /* 操作の画面（設定・指令通達・操作番号） */
  .modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #000b; }
  .modal.on { display: flex; }
  .sheet { width: min(560px, 94vw); max-height: 92vh; overflow: auto; background: #000; border: 2px solid #444; border-radius: 12px; }
  .sheet h2 { margin: 0; padding: 12px; text-align: center; font-size: 24px; background: #c80000; border-radius: 10px 10px 0 0; }
  .sheet .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .name { width: 25%; font-size: 20px; }
  .sel { flex: 1; display: flex; gap: 6px; }
  .sel button { width: 56px; }
  .sel .val { flex: 1; display: flex; align-items: center; justify-content: center; background: #1e1e1e; border-radius: 8px; font-size: 20px; padding: 10px 4px; text-align: center; }
  .sheet button { font: inherit; font-size: 20px; color: #fff; background: #333; border: 0; border-radius: 8px; padding: 12px; }
  .sheet button.go { background: #008c3c; }
  .sheet button.red { background: #c80000; }
  .sheet button.off { background: #5a5a5a; }
  .sheet textarea { width: 100%; box-sizing: border-box; height: 180px; font: inherit; font-size: 20px; background: #111; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 10px; }
  .sheet .note { color: #9aa6ba; font-size: 14px; line-height: 1.6; }
  .sheet input.pin { font-size: 34px; letter-spacing: 12px; text-align: center; padding: 10px; background: #111; color: #fff; border: 1px solid #555; border-radius: 8px; }
  .btns { display: flex; gap: 10px; }
  .btns button { flex: 1; }
  #toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; padding: 10px 18px; border-radius: 99px; background: #222e; color: #fff; font-size: 16px; display: none; }
  #toast.bad { background: #b71c1ce8; }
  #toast.good { background: #1b7f3ae8; }
</style>
</head>
<body>
<div id="stage"><div id="canvas"></div></div>
<div id="status"></div>
<button id="change">番号を変える</button>

<div id="toast"></div>

<div class="modal" id="pinModal"><div class="sheet">
  <h2>操作番号</h2>
  <div class="body">
    <div class="note">iPad から操作するには、ゲームの中のタブレットの「設定」の画面の下に出ている、<b>4 けたの操作番号</b>（／の右）を入れてください。<br>乗務員チームの人だけに出ます。iPad からの操作は、その人が操作したことになります。</div>
    <input class="pin" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    <div class="btns"><button class="off" id="pinCancel">やめる</button><button class="go" id="pinOk">決定</button></div>
  </div>
</div></div>

<div class="modal" id="setModal"><div class="sheet">
  <h2>設定</h2>
  <div class="body">
    <div class="row"><div class="name">形式</div><div class="sel"><button id="tL">◀</button><div class="val" id="tV">-</div><button id="tR">▶</button></div></div>
    <div class="row"><div class="name">編成</div><div class="sel"><button id="uL">◀</button><div class="val" id="uV">-</div><button id="uR">▶</button></div></div>
    <div class="row"><div class="name"></div><button class="go" id="unitGo" style="flex:1">この編成にする</button></div>
    <div class="row"><div class="name">種別</div><div class="sel"><button id="kL">◀</button><div class="val" id="kV">-</div><button id="kR">▶</button></div></div>
    <div class="row"><div class="name">表示</div><button id="dispBtn" style="flex:1">-</button></div>
    <div class="btns"><button class="off" id="pinChange">操作番号を変える</button><button class="red" id="setBack">戻る</button></div>
  </div>
</div></div>

<div class="modal" id="memoModal"><div class="sheet">
  <h2>指令通達メモ</h2>
  <div class="body">
    <textarea id="memoText" placeholder="ここに入力"></textarea>
    <div class="row" style="justify-content:space-between"><span class="note" id="memoCount"></span>
      <div class="sel" style="flex:0 0 auto"><span class="note" style="align-self:center">文字サイズ</span><button id="mL">−</button><div class="val" id="mV" style="min-width:60px">-</div><button id="mR">＋</button></div></div>
    <div class="btns"><button class="off" id="memoClear">消去</button><button class="go" id="memoSend">送信</button></div>
    <button class="red" id="memoBack">戻る</button>
  </div>
</div></div>

<div class="modal" id="dynModal"></div>

<div id="login">
  <div class="box">
    <h1>運転士支援タブレット</h1>
    <p>ゲームの中のタブレットの設定画面、または<br>モニターの車内設定の画面に出ている<br>6 けたの接続番号を入れてください</p>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
    <button id="go">接続</button>
    <div id="err"></div>
  </div>
</div>

<script>
// ============================================================
// 設定：自分の Firebase の Realtime Database の URL（最後に / を付けない）
// ============================================================
const DB_URL = "https://amagase-tablet-default-rtdb.asia-southeast1.firebasedatabase.app";

const WATCH_SEC = 10;   // 「見ています」の印を書く間隔（秒）
const STALE_SEC = 15;   // ゲームからの更新がこの秒数ないと「止まっています」と出す

// ============================================================
const $ = (id) => document.getElementById(id);
let code = null;
let es = null;
let watchTimer = null;
let state = { meta: null, nodes: {} };
let els = {};           // 部品の番号 → 画面の要素
let fitCache = {};      // 文字の大きさの計算結果
let renderQueued = false;
let lastEvent = 0;
let wakeLock = null;

// ---------------- 接続番号 ----------------
function showLogin(msg) {
  $("login").style.display = "flex";
  $("err").textContent = msg || "";
  $("status").style.display = "none";
  $("change").style.display = "none";
  const saved = localStorage.getItem("tabletCode");
  if (saved && !$("code").value) $("code").value = saved;
  setTimeout(() => $("code").focus(), 50);
}

function start(c) {
  if (!/^\d{6}$/.test(c)) { showLogin("6 けたの数字を入れてください"); return; }
  code = c;
  try { localStorage.setItem("tabletCode", c); } catch (e) {}
  $("login").style.display = "none";
  $("status").style.display = "block";
  $("change").style.display = "block";
  setStatus("接続しています…", false);
  connect();
  keepAwake();
}

$("go").onclick = () => start($("code").value.trim());
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") start($("code").value.trim()); });
$("change").onclick = () => { disconnect(); showLogin(); };

function setStatus(text, bad) {
  $("status").textContent = text;
  $("status").className = bad ? "bad" : "";
}

// ---------------- Firebase ----------------
// 「見ています」の印を書く。時刻は Firebase（Google）のサーバーの時刻にする
//   書いた時刻が返ってくるので、それで iPad の時計のずれ（clockOffset）も直す
let clockOffset = 0;      // インターネットの時刻 − iPad の時刻（ミリ秒）
let clockSynced = false;
function writeWatch() {
  if (!code) return;
  const sent = Date.now();
  fetch(`${DB_URL}/watch/${code}.json`, { method: "PUT", body: JSON.stringify({ ".sv": "timestamp" }) })
    .then((r) => r.ok ? r.json() : null)
    .then((serverMs) => {
      if (typeof serverMs !== "number") return;
      const got = Date.now();
      clockOffset = serverMs - (sent + got) / 2;
      clockSynced = true;
    })
    .catch(() => {});
}
const netNow = () => Date.now() + clockOffset;

// 時計の欄（nm = "time"）を、インターネットの時刻で 1 秒ごとに書きかえる
//   ゲームの中の書き方（「2026/11/03 13:02 48」か「11月3日13時2分48秒」の形）に合わせる
function clockText(sample) {
  const d = new Date(netNow() + 9 * 3600 * 1000); // 日本時刻
  const p2 = (v) => String(v).padStart(2, "0");
  const Y = d.getUTCFullYear(), M = d.getUTCMonth() + 1, D = d.getUTCDate();
  const h = d.getUTCHours(), m = d.getUTCMinutes(), s = d.getUTCSeconds();
  if (/[月時]/.test(sample || "")) {
    const pad = /時0\d分|分0\d秒/.test(sample) || /^\d+月\d+日\d{2}時\d{2}分\d{2}秒$/.test(sample);
    const q = pad ? p2 : String;
    return `${M}月${D}日${h}時${q(m)}分${q(s)}秒`;
  }
  return `${Y}/${p2(M)}/${p2(D)} ${p2(h)}:${p2(m)} ${p2(s)}`;
}
setInterval(() => {
  if (!state.meta) return;
  for (const [key, n] of Object.entries(state.nodes)) {
    if (n && n.nm === "time" && els[key]) drawText(els[key], key, Object.assign({}, n, { t: clockText(n.t) }), n.w, n.h);
  }
}, 250);

function connect() {
  disconnect();
  state = { meta: null, nodes: {} };
  clearCanvas();
  writeWatch();
  watchTimer = setInterval(writeWatch, WATCH_SEC * 1000);

  es = new EventSource(`${DB_URL}/tablets/${code}.json`);
  es.addEventListener("put", (e) => apply("put", JSON.parse(e.data)));
  es.addEventListener("patch", (e) => apply("patch", JSON.parse(e.data)));
  es.addEventListener("keep-alive", () => {});
  es.addEventListener("cancel", () => setStatus("読み込めません（Firebase のルールを確かめてください）", true));
  es.onerror = () => setStatus("通信が切れました。つなぎ直しています…", true);
}

function disconnect() {
  if (es) { es.close(); es = null; }
  if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
}

// path（"/nodes/n12/t" など）の場所に値を入れる
function setAt(root, path, value) {
  const parts = path.split("/").filter(Boolean);
  if (parts.length === 0) return value;
  let obj = root;
  for (let i = 0; i < parts.length - 1; i++) {
    if (typeof obj[parts[i]] !== "object" || obj[parts[i]] === null) obj[parts[i]] = {};
    obj = obj[parts[i]];
  }
  const last = parts[parts.length - 1];
  if (value === null) delete obj[last]; else obj[last] = value;
  return root;
}

function apply(kind, msg) {
  lastEvent = Date.now();
  let root = state;
  if (kind === "put") {
    if (msg.path === "/" ) {
      root = msg.data || { meta: null, nodes: {} };
      els = {}; fitCache = {}; clearCanvas();
    } else {
      root = setAt(root, msg.path, msg.data);
    }
  } else {
    for (const [k, v] of Object.entries(msg.data || {})) {
      root = setAt(root, msg.path.replace(/\/$/, "") + "/" + k, v);
    }
  }
  state = root || {};
  state.meta = state.meta || null;
  state.nodes = state.nodes || {};
  queueRender();
  onAck();
  if (openPanel) refreshPanel();
}

// ---------------- 画面を描く ----------------
function clearCanvas() { $("canvas").innerHTML = ""; els = {}; }

function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

const rgba = (hex, t) => {
  const n = parseInt(hex || "000000", 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${1 - (t || 0)})`;
};
const ud = (u, size) => (u ? u[0] * size + u[1] : 0); // [scale, offset]

function render() {
  const meta = state.meta;
  if (!meta) {
    setStatus("ゲームのタブレットが見つかりません（番号を確かめるか、少し待ってください）", true);
    return;
  }
  const W = meta.w || 800, H = meta.h || 600;
  const canvas = $("canvas");
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  fitStage(W, H);

  // 使わなくなった要素を消す
  for (const key of Object.keys(els)) {
    if (!state.nodes[key]) { els[key].remove(); delete els[key]; delete fitCache[key]; }
  }

  // 重なりの順（z → 並び順）
  const keys = Object.keys(state.nodes).filter((k) => state.nodes[k] && state.nodes[k].w !== undefined);
  keys.sort((a, b) => {
    const A = state.nodes[a], B = state.nodes[b];
    return ((A.z || 0) - (B.z || 0)) || ((A.o || 0) - (B.o || 0));
  });

  keys.forEach((key, idx) => {
    const n = state.nodes[key];
    let el = els[key];
    if (!el) {
      el = document.createElement("div");
      el.className = "g";
      els[key] = el;
      canvas.appendChild(el);
    }
    const st = el.style;
    const w = n.w, h = n.h;
    st.left = n.x + "px"; st.top = n.y + "px";
    st.width = Math.max(0, w) + "px"; st.height = Math.max(0, h) + "px";
    st.zIndex = idx + 1;
    st.transform = n.r ? `rotate(${n.r}deg)` : "";
    st.background = (n.bgt ?? 0) >= 1 ? "transparent" : rgba(n.bg, n.bgt);
    st.borderRadius = (n.cr || 0) + "px";
    // ふち（UIStroke）と枠線（BorderSizePixel）
    const shadows = [];
    if (n.st && n.st[3] !== "t") shadows.push(`0 0 0 ${n.st[1]}px ${rgba(n.st[0], n.st[2])}`);
    if (n.bd) {
      const c = rgba(n.bd[0], n.bgt), size = n.bd[1];
      if (n.bd[2] === "i") shadows.push(`inset 0 0 0 ${size}px ${c}`);
      else if (n.bd[2] === "m") { shadows.push(`inset 0 0 0 ${size / 2}px ${c}`); shadows.push(`0 0 0 ${size / 2}px ${c}`); }
      else shadows.push(`0 0 0 ${size}px ${c}`);
    }
    st.boxShadow = shadows.join(",");
    // はみ出しを隠す範囲（親の ClipsDescendants）
    if (n.cl && !n.r) {
      const t = n.cl[1] - n.y, l = n.cl[0] - n.x;
      const r = (n.x + w) - (n.cl[0] + n.cl[2]), b = (n.y + h) - (n.cl[1] + n.cl[3]);
      st.clipPath = `inset(${t}px ${r}px ${b}px ${l}px)`;
    } else {
      st.clipPath = "";
    }
    if (n.nm === "time") drawText(el, key, Object.assign({}, n, { t: clockText(n.t) }), w, h); // 時計はインターネットの時刻
    else if (n.t !== undefined && n.t !== "") drawText(el, key, n, w, h);
    else if (el._tx) { el._tx.remove(); el._tx = null; }
  });

  const age = (Date.now() - (meta.updated || 0)) / 1000;
  if (age > STALE_SEC) setStatus(`${meta.train || ""}：ゲームからの更新が止まっています`, true);
  else setStatus(`${meta.train || ""}　接続中`, false);
}

function drawText(el, key, n, w, h) {
  let tx = el._tx;
  if (!tx) {
    tx = document.createElement("div");
    tx.className = "tx";
    tx.appendChild(document.createElement("span"));
    el.appendChild(tx);
    el._tx = tx;
  }
  const span = tx.firstChild;
  const text = n.t || "";
  const wrap = !!n.wr || text.includes("\n");
  tx.style.justifyContent = n.ax === "l" ? "flex-start" : n.ax === "r" ? "flex-end" : "center";
  tx.style.alignItems = n.ay === "t" ? "flex-start" : n.ay === "b" ? "flex-end" : "center";
  span.style.textAlign = n.ax === "l" ? "left" : n.ax === "r" ? "right" : "center";
  span.style.whiteSpace = wrap ? "pre-wrap" : "pre";
  span.style.wordBreak = wrap ? "break-all" : "normal";
  span.style.color = rgba(n.tc, n.tt);
  span.style.fontWeight = n.b ? "700" : "400";
  if (n.st && n.st[3] === "t") {
    span.style.webkitTextStroke = `${n.st[1] * 2}px ${rgba(n.st[0], n.st[2])}`;
    span.style.paintOrder = "stroke fill";
  } else {
    span.style.webkitTextStroke = "";
  }
  if (span.textContent !== text) span.textContent = text;

  // 文字の大きさ（TextScaled のとき）
  //   ゲームの中で文字が占めている大きさ（tbw × tbh）が分かればそれに合わせ、
  //   分からないとき（読み取った人の画面にタブレットが映っていないときなど）は、欄に収まる一番大きい大きさ（最大 100）にする
  let tw = n.tbw || 0, th = n.tbh || 0, maxSize = 200;
  if (!(tw > 0 && th > 0)) { tw = w; th = h; maxSize = 100; }
  if (n.sc && tw > 0 && th > 0) {
    const cacheKey = [text, tw, th, w, n.b, wrap].join("|");
    if (fitCache[key] && fitCache[key].k === cacheKey) {
      span.style.fontSize = fitCache[key].s + "px";
    } else {
      let lo = 1, hi = maxSize;
      while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        span.style.fontSize = mid + "px";
        if (span.scrollWidth <= tw + 2 && span.scrollHeight <= th + 2) lo = mid; else hi = mid - 1;
      }
      span.style.fontSize = lo + "px";
      fitCache[key] = { k: cacheKey, s: lo };
    }
  } else {
    span.style.fontSize = (n.ts || 14) + "px";
  }
}

// 画面いっぱいに合わせて拡大・縮小
function fitStage(W, H) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  const c = $("canvas");
  c.style.transform = `scale(${s})`;
  c.style.left = ((vw - W * s) / 2) + "px";
  c.style.top = ((vh - H * s) / 2) + "px";
}
window.addEventListener("resize", () => { if (state.meta) fitStage(state.meta.w, state.meta.h); });

// 止まっていないかの確認（更新が来なくても、表示を直す）
setInterval(() => { if (state.meta) queueRender(); }, 3000);

// 画面を消さない（対応している端末だけ）
async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && code) { keepAwake(); writeWatch(); }
});

// ============================================================
// iPad からの操作（設定・指令通達）
// ============================================================
let openPanel = null;   // 開いている画面（"set" / "memo"）
let pendingId = null;   // 送った操作の番号（結果を待っている）
let lastAckT = 0;
let pinThen = null;     // 操作番号を入れたあとに開く画面
let sel = { ti: 1, ui: 1, memoSize: 80 };

const pinKey = () => "tabletPin_" + code;
const getPin = () => { try { return localStorage.getItem(pinKey()); } catch (e) { return null; } };
const setPin = (p) => { try { if (p) localStorage.setItem(pinKey(), p); else localStorage.removeItem(pinKey()); } catch (e) {} };

let toastTimer = null;
function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.className = kind || "";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), 3000);
}

function show(id, on) { $(id).classList.toggle("on", on); }

// 操作番号を聞いてから、画面を開く
function needPin(then) {
  if (getPin()) { then(); return; }
  pinThen = then;
  $("pinInput").value = "";
  show("pinModal", true);
  setTimeout(() => $("pinInput").focus(), 50);
}
$("pinOk").onclick = () => {
  const p = $("pinInput").value.trim();
  if (!/^\d{4}$/.test(p)) { toast("4 けたの数字を入れてください", "bad"); return; }
  setPin(p);
  show("pinModal", false);
  if (pinThen) { const f = pinThen; pinThen = null; f(); }
};
$("pinCancel").onclick = () => { show("pinModal", false); pinThen = null; };
$("pinChange").onclick = () => { setPin(null); show("setModal", false); openPanel = null; needPin(openSettings); };

// 操作を送る（Firebase の cmd に書く。ゲームのサーバーが 1 秒ごとに取りに来る）
async function sendCmd(action, value) {
  const pin = getPin();
  if (!pin) { needPin(() => sendCmd(action, value)); return; }
  try {
    const res = await fetch(`${DB_URL}/cmd/${code}.json`, {
      method: "POST",
      body: JSON.stringify({ p: pin, a: action, v: JSON.stringify(value), t: { ".sv": "timestamp" } }),
    });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    pendingId = j.name;
    toast("送信しています…");
  } catch (e) {
    toast("送れませんでした（通信を確かめてください）", "bad");
  }
}

// ゲームからの結果（ack）
function onAck() {
  const a = state.ack;
  if (!a || !a.t || a.t <= lastAckT) return;
  lastAckT = a.t;
  if (pendingId && a.id !== pendingId) return;
  pendingId = null;
  toast(a.msg || (a.ok ? "反映しました" : "できませんでした"), a.ok ? "good" : "bad");
  if (!a.ok && /操作番号/.test(a.msg || "") && /ちがい/.test(a.msg || "")) setPin(null);
}

// ---------------- 設定 ----------------
function openSettings() {
  const o = state.opts;
  if (!o) { toast("設定の選択肢がまだ届いていません。少し待ってください", "bad"); return; }
  sel.ti = (o.now && o.now.ti) || 1;
  sel.ui = (o.now && o.now.ui) || 1;
  openPanel = "set";
  refreshPanel();
  show("setModal", true);
}
function trains() { return (state.opts && state.opts.trains) || []; }
function types() { return (state.opts && state.opts.types) || []; }
const listOf = (x) => Array.isArray(x) ? x.filter(Boolean) : Object.values(x || {});

function refreshPanel() {
  const o = state.opts || {};
  const now = o.now || {};
  if (openPanel === "set") {
    const tl = listOf(trains());
    const t = tl[sel.ti - 1];
    const ul = t ? listOf(t.units) : [];
    const u = ul[sel.ui - 1];
    $("tV").textContent = t ? t.name : "（なし）";
    $("uV").textContent = u ? (u.maneno ? `${u.unit}（${u.maneno}）` : u.unit) : "（なし）";
    const k = listOf(types()).find((x) => x.value === now.type);
    $("kV").textContent = k ? k.name : "未設定";
    $("dispBtn").textContent = now.disponoff ? "ON" : "OFF";
    $("dispBtn").className = now.disponoff ? "go" : "off";
  } else if (openPanel === "dyn") {
    if (dynRefresh) dynRefresh();
  } else if (openPanel === "memo") {
    $("mV").textContent = sel.memoSize;
    $("memoCount").textContent = `${[...$("memoText").value].length} / ${o.memoMax || 200} 文字`;
  }
}

$("tL").onclick = () => { const n = listOf(trains()).length; if (n) { sel.ti = (sel.ti - 2 + n) % n + 1; sel.ui = 1; refreshPanel(); } };
$("tR").onclick = () => { const n = listOf(trains()).length; if (n) { sel.ti = sel.ti % n + 1; sel.ui = 1; refreshPanel(); } };
$("uL").onclick = () => { const t = listOf(trains())[sel.ti - 1]; const n = t ? listOf(t.units).length : 0; if (n) { sel.ui = (sel.ui - 2 + n) % n + 1; refreshPanel(); } };
$("uR").onclick = () => { const t = listOf(trains())[sel.ti - 1]; const n = t ? listOf(t.units).length : 0; if (n) { sel.ui = sel.ui % n + 1; refreshPanel(); } };
$("unitGo").onclick = () => sendCmd("unit", { ti: sel.ti, ui: sel.ui });
function moveType(dir) {
  const list = listOf(types());
  if (!list.length) return;
  const cur = (state.opts && state.opts.now && state.opts.now.type) || 0;
  let i = list.findIndex((x) => x.value === cur);
  if (i < 0) i = dir > 0 ? -1 : 0;
  i = (i + dir + list.length) % list.length;
  $("kV").textContent = list[i].name;
  sendCmd("set", { name: "type", value: list[i].value });
}
$("kL").onclick = () => moveType(-1);
$("kR").onclick = () => moveType(1);
$("dispBtn").onclick = () => {
  const on = !!(state.opts && state.opts.now && state.opts.now.disponoff);
  sendCmd("set", { name: "disponoff", value: !on });
};
$("setBack").onclick = () => { show("setModal", false); openPanel = null; };

// ---------------- 指令通達 ----------------
function openMemo() {
  const o = state.opts || {};
  const now = o.now || {};
  $("memoText").value = now.memo || "";
  $("memoText").maxLength = o.memoMax || 200;
  sel.memoSize = now.memoSize || 80;
  openPanel = "memo";
  refreshPanel();
  show("memoModal", true);
}
$("memoText").addEventListener("input", refreshPanel);
$("mL").onclick = () => { const o = state.opts || {}; sel.memoSize = Math.max(o.memoSizeMin || 10, sel.memoSize - 5); refreshPanel(); };
$("mR").onclick = () => { const o = state.opts || {}; sel.memoSize = Math.min(o.memoSizeMax || 200, sel.memoSize + 5); refreshPanel(); };
$("memoSend").onclick = () => sendCmd("memo", { text: $("memoText").value, size: sel.memoSize });
$("memoClear").onclick = () => { $("memoText").value = ""; refreshPanel(); sendCmd("memo", { text: "", size: sel.memoSize }); };
$("memoBack").onclick = () => { show("memoModal", false); openPanel = null; };

// ---------------- モニターの操作（方向幕設定・運用設定・車内設定・タブレットとの同期） ----------------
let dynRefresh = null;
const BLUE = "#0046a0";
function mk(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function sheet(title, color) {
  const m = $("dynModal");
  m.innerHTML = "";
  const sh = mk("div", "sheet");
  const h = mk("h2", "", title);
  h.style.background = color || BLUE;
  const body = mk("div", "body");
  sh.append(h, body);
  m.appendChild(sh);
  show("dynModal", true);
  openPanel = "dyn";
  dynRefresh = null;
  return body;
}
function closeDyn() { show("dynModal", false); openPanel = null; dynRefresh = null; }
function selRow(body, label) {
  const row = mk("div", "row");
  const name = mk("div", "name", label);
  const sel = mk("div", "sel");
  const l = mk("button", "", "◀"), v = mk("div", "val", "-"), r = mk("button", "", "▶");
  sel.append(l, v, r);
  row.append(name, sel);
  body.appendChild(row);
  return { name, l, v, r };
}
function btnRow(body, items) {
  const row = mk("div", "btns");
  const out = items.map(([text, cls, fn]) => { const b = mk("button", cls, text); b.onclick = fn; row.appendChild(b); return b; });
  body.appendChild(row);
  return out;
}
function opts() {
  const o = state.opts;
  if (!o) { toast("設定の選択肢がまだ届いていません。少し待ってください", "bad"); return null; }
  return o;
}
const stepI = (i, n, d) => (n ? (i + d + n) % n : 0);

// 方向幕設定
function openMaku() {
  const o = opts(); if (!o) return;
  const mo = o.maku;
  if (!mo) { toast("方向幕のデータを読み込めませんでした", "bad"); return; }
  const types = listOf(mo.types), terms = listOf(mo.terminals), specs = listOf(mo.specials), valid = mo.valid || {};
  const now = o.now || {};
  const idx = (list, v) => Math.max(0, list.findIndex((x) => x.value === v));
  let ti = idx(types, now.type || 2);
  const non = () => types[ti] && types[ti].value === 1;
  let ai = non() ? idx(specs, now.startsta || 1) : idx(terms, now.startsta || 1);
  let bi = idx(terms, now.endsta || 1);

  const body = sheet("方向幕設定");
  const T = selRow(body, "種別"), A = selRow(body, "始発"), B = selRow(body, "終点");
  const preview = mk("div", "note"); preview.style.fontSize = "18px"; preview.style.textAlign = "center";
  body.appendChild(preview);
  const code = () => non()
    ? [`${types[ti].value}${specs[ai].value}0`, types[ti].value, specs[ai].value, 0]
    : [`${types[ti].value}${terms[ai].value}${terms[bi].value}`, types[ti].value, terms[ai].value, terms[bi].value];
  const [applyB] = btnRow(body, [
    ["設定", "go", () => { const [c, t, a, b] = code(); if (!valid[c]) return; sendCmd("maku", { t, a, b }); closeDyn(); }],
    ["戻る", "red", closeDyn],
  ]);
  const refresh = () => {
    if (!types.length) return;
    T.v.textContent = types[ti].name;
    if (non()) {
      A.name.textContent = "内容"; A.v.textContent = specs[ai] ? specs[ai].name : "-";
      B.v.textContent = "－"; B.l.style.visibility = B.r.style.visibility = "hidden";
    } else {
      A.name.textContent = "始発"; A.v.textContent = terms[ai] ? terms[ai].name : "-";
      B.v.textContent = terms[bi] ? terms[bi].name : "-"; B.l.style.visibility = B.r.style.visibility = "visible";
    }
    const desc = valid[code()[0]];
    preview.textContent = desc || "設定できない組み合わせです";
    preview.style.color = desc ? "#fff" : "#ff6b6b";
    applyB.className = desc ? "go" : "off";
  };
  T.l.onclick = () => { ti = stepI(ti, types.length, -1); ai = 0; bi = 0; refresh(); };
  T.r.onclick = () => { ti = stepI(ti, types.length, 1); ai = 0; bi = 0; refresh(); };
  A.l.onclick = () => { ai = stepI(ai, non() ? specs.length : terms.length, -1); refresh(); };
  A.r.onclick = () => { ai = stepI(ai, non() ? specs.length : terms.length, 1); refresh(); };
  B.l.onclick = () => { bi = stepI(bi, terms.length, -1); refresh(); };
  B.r.onclick = () => { bi = stepI(bi, terms.length, 1); refresh(); };
  refresh();
}

// 運用設定（ダイヤの列車）
function openRoute() {
  const o = opts(); if (!o) return;
  const list = listOf(o.diagrams);
  const body = sheet("運用設定");
  if (!list.length) {
    body.appendChild(mk("div", "note", "ダイヤのデータがありません"));
    btnRow(body, [["戻る", "red", closeDyn]]);
    return;
  }
  let i = Math.max(0, list.findIndex((x) => x.trainNo === (o.now && o.now.trainno)));
  const R = selRow(body, "列車");
  const detail = mk("div", "note"); detail.style.fontSize = "18px"; detail.style.whiteSpace = "pre-line"; detail.style.textAlign = "center";
  body.appendChild(detail);
  const refresh = () => {
    const it = list[i];
    R.v.textContent = it.trainNo;
    detail.textContent = [`運用 ${it.unyou ?? "－"}`, it.typeName || "", `${it.from} → ${it.to}`].filter(Boolean).join("\n");
  };
  R.l.onclick = () => { i = stepI(i, list.length, -1); refresh(); };
  R.r.onclick = () => { i = stepI(i, list.length, 1); refresh(); };
  btnRow(body, [
    ["設定", "go", () => { sendCmd("diagram", { trainNo: list[i].trainNo }); closeDyn(); }],
    ["戻る", "red", closeDyn],
  ]);
  refresh();
}

// タブレットとの同期
function openSync() {
  if (!opts()) return;
  const body = sheet("タブレットとの同期");
  body.appendChild(mk("div", "note", "同期する項目：種別・次の駅・通過／停車"));
  const row = mk("div", "row");
  const autoB = mk("button", "", "-"); autoB.style.flex = "1";
  row.append(mk("div", "name", "自動同期"), autoB);
  body.appendChild(row);
  body.appendChild(mk("div", "note", "ON にすると、設定や現在位置が変わるたびにタブレットへ写します"));
  const nowB = mk("button", "", "今すぐ同期"); nowB.style.background = "#005ac8";
  nowB.onclick = () => sendCmd("sync", {});
  body.appendChild(nowB);
  btnRow(body, [["戻る", "red", closeDyn]]);
  const refresh = () => {
    const on = !!(state.opts && state.opts.now && state.opts.now.autosync);
    autoB.textContent = on ? "ON" : "OFF";
    autoB.className = on ? "go" : "off";
  };
  autoB.onclick = () => sendCmd("autosync", { on: !(state.opts && state.opts.now && state.opts.now.autosync) });
  dynRefresh = refresh;
  refresh();
}

// 車内設定（ワイパー・尾灯）
function openCabin() {
  if (!opts()) return;
  const body = sheet("車内設定");
  const grid = mk("div", "btns");
  const w = mk("button", "", "ワイパー"), t = mk("button", "", "尾灯");
  w.onclick = openWiper; t.onclick = openTail;
  grid.append(w, t);
  body.appendChild(grid);
  btnRow(body, [["戻る", "red", closeDyn]]);
}
function openWiper() {
  const body = sheet("ワイパー");
  const row = mk("div", "row");
  const onB = mk("button", "", "-"); onB.style.flex = "1";
  row.append(mk("div", "name", "ワイパー"), onB);
  body.appendChild(row);
  const row2 = mk("div", "row");
  row2.appendChild(mk("div", "name", "速さ"));
  const sp = mk("div", "btns"); sp.style.flex = "1";
  const names = ["間欠", "普通", "早い"];
  const spB = names.map((n, i) => { const b = mk("button", "", n); b.onclick = () => sendCmd("wiper", { kind: "speed", value: i + 1 }); sp.appendChild(b); return b; });
  row2.appendChild(sp);
  body.appendChild(row2);
  btnRow(body, [["戻る", "red", openCabin]]);
  const refresh = () => {
    const now = (state.opts && state.opts.now) || {};
    onB.textContent = now.wiperOn ? "ON" : "OFF";
    onB.className = now.wiperOn ? "go" : "off";
    spB.forEach((b, i) => (b.style.background = (now.wiperSpeed || 2) === i + 1 ? "#005ac8" : "#323232"));
  };
  onB.onclick = () => sendCmd("wiper", { kind: "on", value: !((state.opts && state.opts.now && state.opts.now.wiperOn)) });
  dynRefresh = refresh;
  refresh();
}
function openTail() {
  const body = sheet("尾灯");
  const tails = listOf(state.opts && state.opts.tails);
  if (!tails.length) body.appendChild(mk("div", "note", "尾灯が見つかりません"));
  const btns = {};
  tails.forEach((tl) => {
    const row = mk("div", "row");
    const n = (tl.car.match(/(\d+)$/) || [])[1];
    const b = mk("button", "", "-"); b.style.flex = "1";
    b.onclick = () => {
      const cur = listOf(state.opts && state.opts.tails).find((x) => x.car === tl.car);
      sendCmd("tail", { car: tl.car, value: !(cur && cur.on) });
    };
    row.append(mk("div", "name", n ? `${n}号車` : tl.car), b);
    body.appendChild(row);
    btns[tl.car] = b;
  });
  btnRow(body, [["戻る", "red", openCabin]]);
  const refresh = () => {
    listOf(state.opts && state.opts.tails).forEach((x) => {
      const b = btns[x.car]; if (!b) return;
      b.textContent = x.on ? "点灯" : "消灯";
      b.style.background = x.on ? "#c81e1e" : "#5a5a5a";
    });
  };
  dynRefresh = refresh;
  refresh();
}

// ---------------- 映っている画面を押したとき ----------------
//   「設定」ボタン → 設定、指令通達の枠 → 指令通達
$("stage").addEventListener("click", (e) => {
  if (!state.meta) return;
  const c = $("canvas").getBoundingClientRect();
  const s = c.width / (state.meta.w || 1);
  const x = (e.clientX - c.left) / s, y = (e.clientY - c.top) / s;
  let hit = null;
  for (const n of Object.values(state.nodes)) {
    if (n && n.nm && x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) {
      if (!hit || (n.o || 0) > (hit.o || 0)) hit = n;
    }
  }
  if (!hit) return;
  const open = {
    setting: openSettings, sirei: openMemo,                 // タブレット
    makuset: openMaku, routeset: openRoute,                 // モニター
    cabinset: openCabin, tabletsync: openSync,
  }[hit.nm];
  if (open) needPin(open);
});

// URL の ?code=123456 でもすぐに接続できる
const qp = new URLSearchParams(location.search).get("code");
if (DB_URL.includes("あなたの")) {
  showLogin("この HTML の DB_URL に、Firebase の URL を入れてください");
} else if (qp) {
  start(qp);
} else {
  showLogin();
}
</script>
